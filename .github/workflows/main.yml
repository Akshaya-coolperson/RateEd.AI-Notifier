name: Check RateEd Schedule

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch:        # lets you manually trigger it from the Actions tab
    inputs:
      send_test_email:
        description: "Only send a test email (skips the RateEd check)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          RATEED_USERNAME: ${{ secrets.RATEED_USERNAME }}
          RATEED_PASSWORD: ${{ secrets.RATEED_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: python check_rateed.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update seen state [skip ci]"
            git push
          else
            echo "No state changes."
          fi
